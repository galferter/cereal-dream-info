<body>
  <h1>Messwerte: Kurbelkräfte verschiedener Getreidesorten</h1>

  <table aria-describedby="desc">
    <caption id="desc">Gemessene obere und untere Kraftbereiche in Newton (N)</caption>
    <thead>
      <tr>
        <th>Getreide</th>
        <th>gemessener oberer Kraftbereich [N]</th>
        <th>gemessener unterer Kraftbereich [N]</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>Hafer</td><td>23</td><td>15</td></tr>
      <tr><td>Dinkel</td><td>40</td><td>20</td></tr>
      <tr><td>Roggen</td><td>50</td><td>25</td></tr>
      <tr><td>Weizen</td><td>50</td><td>30</td></tr>
      <tr><td>Gerste</td><td>&gt;50</td><td>35</td></tr>
    </tbody>
  </table>

  <!-- JSON-LD: Dataset für semantische Maschinenlesbarkeit -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Dataset",
    "name": "Kurbelkräfte verschiedener Getreidesorten",
    "description": "Gemessene obere und untere Kraftbereiche in Newton (N)",
    "variableMeasured": [
      {
        "getreide": "Hafer",
        "gemessener oberer Kraftbereich [N]": 23,
        "gemessener unterer Kraftbereich [N]": 15
      },
      {
        "getreide": "Dinkel",
        "gemessener oberer Kraftbereich [N]": 40,
        "gemessener unterer Kraftbereich [N]": 20
      },
      {
        "getreide": "Roggen",
        "gemessener oberer Kraftbereich [N]": 50,
        "gemessener unterer Kraftbereich [N]": 25
      },
      {
        "getreide": "Weizen",
        "gemessener oberer Kraftbereich [N]": 50,
        "gemessener unterer Kraftbereich [N]": 30
      },
      {
        "getreide": "Gerste",
        "gemessener oberer Kraftbereich [N]": { "minValue": 50 },
        "gemessener unterer Kraftbereich [N]": 35
      }
    ]
  }
  </script>
